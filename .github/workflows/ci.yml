name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project (with dev deps)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check

      - name: Test (pytest)
        run: pytest

      - name: Byte-compile all sources
        run: python -m compileall -q odoo_instance_manager.py instance_manager

      - name: Build the wheel and import it from a clean venv
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "import odoo_instance_manager, instance_manager.workflows.manage, instance_manager.support, instance_manager.neutralise"

      - name: Verify the generated data commands (stubs + a throwaway PostgreSQL)
        run: python tools/verify_data_safety.py

      - name: Verify secrets stay out of process arguments, previews and errors
        run: python tools/verify_secrets.py

      - name: Verify nginx and fail2ban accept the generated configuration
        run: |
          sudo apt-get update -qq
          python tools/verify_ops_configs.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.4.1

      - name: Validate specs
        run: openspec validate --specs

      - name: Checkout eunomai (pinned, for the doc/provenance checks)
        uses: actions/checkout@v7
        with:
          repository: grojof/eunomai
          ref: v0.6.1
          path: .eunomai

      - name: Docs check
        run: node .eunomai/tools/dist/cli.cjs docs-check

      - name: Provenance check
        run: node .eunomai/tools/dist/cli.cjs provenance-check
