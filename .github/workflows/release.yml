name: Release

# Build the package and publish a GitHub Release on every version tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  # Every check CI runs (lint, tests on 3.9 and 3.12, the verify tools, specs, docs).
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project (with dev deps) + build tooling
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" build==1.6.1 twine==7.0.0

      - name: Verify the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Verify the tag matches the pyproject version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$VERSION pyproject=$PYPROJECT_VERSION"
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Lint (ruff)
        run: ruff check

      - name: Test (pytest)
        run: pytest

      - name: Byte-compile all sources
        run: python -m compileall -q odoo_instance_manager.py instance_manager

      - name: Build sdist + wheel
        run: python -m build

      - name: Check the built artifacts
        run: twine check dist/*

      - name: Import the wheel from a clean venv
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "import odoo_instance_manager, instance_manager.workflows.manage, instance_manager.support, instance_manager.neutralise"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v start="## [$VERSION]" '
            index($0, start) == 1 { f = 1; next }
            /^## \[/ { if (f) exit }
            f
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION: the tag, the version and the changelog must agree." >&2
            exit 1
          fi
          {
            echo
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          } >> release_notes.md

      - name: Publish the GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release_notes.md
          else
            # A pre-release (v1.3.0-rc1) never becomes the latest release.
            case "$GITHUB_REF_NAME" in
              *-*) kind="--prerelease" ;;
              *) kind="--latest" ;;
            esac
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md \
              "$kind" \
              --verify-tag
          fi
