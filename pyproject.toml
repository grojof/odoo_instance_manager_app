[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-instance-manager"
version = "1.3.0"
description = "Interactive, root-run CLI to install, maintain, and audit multi-instance Odoo Community servers on Debian/Ubuntu."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Guillermo Rojo" }]
keywords = ["odoo", "ubuntu", "sysadmin", "multi-instance", "postgresql", "nginx", "fail2ban"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# ruff pinned: a new release adds rules, and CI must not change verdict on its own.
dev = ["pytest>=8", "ruff==0.16.8"]

[project.scripts]
odoo-instance-manager = "odoo_instance_manager:main"

[project.urls]
Homepage = "https://github.com/grojof/odoo_instance_manager_app"
Repository = "https://github.com/grojof/odoo_instance_manager_app"
Issues = "https://github.com/grojof/odoo_instance_manager_app/issues"

[tool.setuptools]
py-modules = ["odoo_instance_manager"]

# Every subpackage (instance_manager.workflows): a fixed list shipped a wheel
# whose CLI died on its first import.
[tool.setuptools.packages.find]
include = ["instance_manager*"]

[tool.ruff]
line-length = 100
# The manager runs on the host's python3: 3.9 is Debian 11's.
target-version = "py39"

[tool.ruff.lint]
# Value rules: real bugs (F, B), imports (I), modernization (UP), style (E, W).
# E501 (line length) is deferred: many long lines are embedded shell/SQL command
# strings that should not be wrapped. New code should still aim for <=100 cols.
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
